[workspace]
resolver = "2"
members = [
    "lai-core",
    "proof",
    "gate",
    "athena",
    "proof/laverna-wasm",
    "gate/cid-wasm",
    "assistant",
]

# MSRV-aware resolution lives in `.cargo/config.toml` (`[resolver]` is a cargo
# config key, not a manifest key). With rust-version = 1.75 there, cargo downgrades
# every transitive dep to its highest release compatible with 1.75.

[workspace.package]
edition = "2021"
# MSRV. The `xalen-*` ephemeris crates (direct deps of `laverna`) are now VENDORED
# under `thirdparty/` and downgraded to edition 2021 (let-chains rewritten,
# `LazyLock` swapped for `OnceLock`), so the critical-path ephemeris is no longer
# tied to edition 2024 or to edition-2024 let-chains (all workspace let-chains
# were rewritten to nested `if`/`if let`). `idna_adapter` is pinned to 1.1.0
# (edition 2021) to drop the `icu`/`zerovec` stack — same IDNA output, ~44 fewer
# deps. The `[resolver]` MSRV-aware setting above downgrades every transitive
# crate to its highest release with rust-version <= 1.75; see AGENTS.md MSRV.
rust-version = "1.75"
license = "Apache-2.0"
authors = ["nutypebuddha <nutypebuddha@proton.me>"]
repository = "https://github.com/nutypebuddha/L"
homepage = "https://github.com/nutypebuddha/L"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
