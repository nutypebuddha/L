[workspace]
resolver = "2"
members = [
    "lai-core",
    "proof",
    "gate",
    "athena",
    "proof/laverna-wasm",
    "gate/cid-wasm",
    "assistant",
]

[workspace.package]
edition = "2024"
# MSRV floor is 1.85. The binding reason is NOT hashbrown/indexmap (those are
# transitive via toml and could be downgraded) — it is the xalen-* ephemeris
# crates: xalen-vedic, xalen-houses, xalen-ayanamsa, xalen-time, xalen-coords
# (direct, non-optional deps of `laverna`), plus xalen-stars transitively. They
# are published as `edition = "2024"` with NO `rust-version` declared, and
# edition2024 requires rustc >= 1.85. Do NOT try to lower the floor by re-pinning
# indexmap/hashbrown — the xalen crates cannot move below 1.85.
rust-version = "1.85"
license = "Apache-2.0"
authors = ["nutypebuddha <nutypebuddha@proton.me>"]
repository = "https://github.com/nutypebuddha/L"
homepage = "https://github.com/nutypebuddha/L"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
