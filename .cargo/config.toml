# MSRV-aware dependency resolution. Forces cargo to prefer each crate's highest
# release whose `rust-version` is <= the workspace MSRV (1.75), so the
# committed Cargo.lock builds on the sandbox toolchain (rustc 1.75) rather than
# pulling edition-2024 / MSRV>1.75 transitive graphs (clap 4.6, rand 0.10,
# time 0.3.55, ...). Stabilized in Rust 1.84.
[resolver]
incompatible-rust-versions = "fallback"
