# L.ai · Rust Code — archetypal construct entities
#
# Each Rust construct is resolved onto a graha so the descent engine can map a
# Rust query onto the wheel and reason back down to proof. properties are
# 0..1 concern weights (deterministic, auditable).

[[entity]]
id = "ownership"
name = "Ownership"
domain = "shani"
description = "Rust's core invariant: every value has a single owner; the borrower checker enforces aliasing XOR mutation at compile time."
graha = "shani"
tattva = "air"
guna = "tamas"
tags = ["rust", "memory_safety", "borrow_checker", "compile_time"]
properties = { memory_safety = 0.98, ergonomics_cost = 0.5, performance = 0.9, learnability = 0.4 }

