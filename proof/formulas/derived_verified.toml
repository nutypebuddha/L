# Derived, graha-tagged, recomputable formulas (IMPROVE L.AI #1).
#
# Every entry is mechanically verifiable: the `expression` references only its
# declared `inputs` (plus Tanto constants like pi, c) and par/serial reductions
# reduce to NAND primitives, so each claim can be recomputed by the binder. Each
# carries a graha/zodiac tag via `tags` so `corpus lint` stays clean.

[[formula]]
id = "geo_triangle_area"
formula_type = "math"
domain = "Surya"
inputs = ["base", "height"]
output = "area"
expression = "0.5 * base * height"
description = "Area of a triangle from base and height: A = ½·b·h."
evidence = "Euclid Elements I.41: a triangle is half the parallelogram on the same base and height."
tags = ["math", "surya", "geometry", "area"]

[[formula]]
id = "geo_pythagorean"
formula_type = "math"
domain = "Surya"
inputs = ["a", "b"]
output = "hypotenuse"
expression = "sqrt(a * a + b * b)"
description = "Pythagorean hypotenuse: c = √(a² + b²)."
evidence = "Pythagoras: in a right triangle the square on the hypotenuse equals the sum of squares on the legs."
tags = ["math", "surya", "geometry", "pythagoras"]

