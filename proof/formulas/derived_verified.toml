[[formula]]
id = "logic_xor"
formula_type = "logic"
domain = "Mangala"
inputs = ["a", "b"]
output = "xor_out"
expression = "a + b - 2 * a * b"
description = "XOR: a ⊕ b = a + b − 2ab — Mars: inequality gate, 1 iff exactly one input is 1."
evidence = "Truth table: XOR(a,b)=1 iff a≠b; over {0,1}, a + b − 2ab gives 1 only when inputs differ."
tags = ["logic", "mangala", "gate", "xor"]

[[formula]]
