output = "implies_out"
expression = "1 - a + a * b"
description = "Material implication: a → b = ¬a ∨ (a∧b) = 1 − a + a·b."
evidence = "Truth table: a→b is false only when a=1 and b=0; otherwise 1."
tags = ["logic", "mangala", "gate", "implication"]

