# L.ai · Rust Code — deterministic layout/formula corpus
#
# Every entry is a machine-checkable, fail-loud arithmetic fact about the Rust
# language (ABI layout, type sizes, ownership overhead). Evaluated by Tanto.
# `domain` maps each to a Vedic graha archetype:
#   mangala = Action & Engineering (performance)
#   budha   = Logic & Communication (type system)
#   shani   = Structure & Time (memory layout, alignment)
#   ketu    = Spirituality & Science (abstraction cost)

[[formula]]
id = "rust_struct_padded_size"
tags = ["rust", "layout", "memory", "shani", "alignment"]
domain = "shani"
level = 3
inputs = ["size", "align"]
input_types = { size = "bytes", align = "bytes" }
input_aliases = { size = ["extent", "length"], align = ["alignment"] }
output = "padded"
output_unit = "bytes"
expression = "ceil(size / align) * align"
description = "Struct padded size: round the unpadded byte size up to the next multiple of the struct alignment"
evidence = "Rust repr(Rust)/repr(C): layout size is the smallest multiple of `align` >= sum of field offsets+field sizes"

[[formula.golden]]
inputs = { size = 13, align = 8 }
output = 16

[[formula.golden]]
inputs = { size = 20, align = 4 }
output = 20

[[formula.golden]]
inputs = { size = 7, align = 8 }
output = 8

[[formula]]
id = "rust_struct_alignment"
tags = ["rust", "layout", "memory", "shani", "alignment"]
domain = "shani"
level = 3
inputs = ["a", "b"]
input_types = { a = "bytes", b = "bytes" }
output = "align"
output_unit = "bytes"
expression = "max(a, b)"
description = "Struct alignment is the maximum of its field alignments (two-field lower bound; max over all fields in general)"
evidence = "Alignment of a composite type = max alignment over all member types"

[[formula.golden]]
inputs = { a = 8, b = 4 }
output = 8

[[formula.golden]]
inputs = { a = 4, b = 8 }
output = 8

[[formula.golden]]
inputs = { a = 16, b = 16 }
output = 16

[[formula]]
id = "rust_align_padding"
tags = ["rust", "layout", "memory", "shani", "padding"]
domain = "shani"
level = 3
inputs = ["size", "align"]
input_types = { size = "bytes", align = "bytes" }
input_aliases = { size = ["extent", "length"], align = ["alignment"] }
output = "padding"
output_unit = "bytes"
expression = "ceil(size / align) * align - size"
description = "Trailing padding bytes added to satisfy struct alignment"
evidence = "padding = padded_size - unpadded_size"

[[formula.golden]]
inputs = { size = 13, align = 8 }
output = 3

[[formula.golden]]
inputs = { size = 20, align = 4 }
output = 0

[[formula]]
id = "rust_enum_size"
tags = ["rust", "layout", "memory", "budha", "enum", "discriminant"]
domain = "budha"
level = 3
